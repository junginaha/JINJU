name: Search privacy badge

on:
  push:
    branches:
      - agent/search-privacy-badge
    paths:
      - .github/workflows/search-privacy-badge.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move privacy copy into search bar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app_path = Path('components/JinjuApp.tsx')
          app = app_path.read_text(encoding='utf-8')
          old_heading = '                <div><p className="eyebrow">공개베타 · 개인정보 0%를 지향합니다.</p><h1>새로운 의견</h1></div>'
          new_heading = '                <div><h1>새로운 의견</h1></div>'
          form_line = '              <form className="chat-search" role="search" onSubmit={(event) => event.preventDefault()}>'
          badge_line = '                <span className="search-privacy-badge">개인정보 0%</span>'
          if app.count(old_heading) != 1: raise SystemExit(f'heading target count={app.count(old_heading)}')
          if app.count(form_line) != 1: raise SystemExit(f'search form target count={app.count(form_line)}')
          if 'search-privacy-badge' in app: raise SystemExit('privacy badge already exists')
          app = app.replace(old_heading, new_heading).replace(form_line, form_line + '\n' + badge_line)
          app_path.write_text(app, encoding='utf-8')
          bridge_path = Path('components/JinjuAppBridge.tsx')
          bridge = bridge_path.read_text(encoding='utf-8')
          for target in ['const FEED_EYEBROW = "개인정보 0%";\n','      const eyebrow = heading.querySelector<HTMLElement>(".eyebrow");\n','      if (eyebrow && eyebrow.textContent !== FEED_EYEBROW) eyebrow.textContent = FEED_EYEBROW;\n\n']:
              if bridge.count(target) != 1: raise SystemExit(f'bridge target count={bridge.count(target)}')
              bridge = bridge.replace(target, '')
          bridge_path.write_text(bridge, encoding='utf-8')
          css_path = Path('app/globals.css')
          css = css_path.read_text(encoding='utf-8')
          old_selector = '.feed-heading .eyebrow, .feed-heading > span, .composer-intro .eyebrow { color: #b3b3b3; font-size: 11px; letter-spacing: 0; }'
          new_selector = '.feed-heading > span, .composer-intro .eyebrow { color: #b3b3b3; font-size: 11px; letter-spacing: 0; }'
          search_css = '.chat-search { position: sticky; z-index: 10; top: 12px; display: flex; align-items: center; gap: 8px; margin-bottom: 28px; padding: 8px 9px 8px 10px; background: #212121f5; border: 1px solid #3a3a3a; border-radius: 18px; box-shadow: 0 10px 32px #00000047; backdrop-filter: blur(12px); }'
          badge_css = '.search-privacy-badge { display: inline-flex; flex: none; min-height: 30px; align-items: center; padding: 0 10px; color: #e7e7e7; font-size: 10px; font-weight: 760; line-height: 1; letter-spacing: -.015em; white-space: nowrap; user-select: none; background: linear-gradient(180deg,#303030,#282828); border: 1px solid #474747; border-radius: 999px; box-shadow: inset 0 1px #ffffff0d; }'
          mobile_old = '  .chat-search { top: 66px; border-radius: 15px; }'
          mobile_new = '  .chat-search { top: 66px; gap: 6px; padding-left: 7px; border-radius: 15px; }\n  .search-privacy-badge { min-height: 28px; padding: 0 8px; font-size: 9px; }'
          for target in [old_selector, search_css, mobile_old]:
              if css.count(target) != 1: raise SystemExit(f'css target count={css.count(target)}')
          css = css.replace(old_selector, new_selector).replace(search_css, search_css + '\n' + badge_css).replace(mobile_old, mobile_new)
          css_path.write_text(css, encoding='utf-8')
          PY
          grep -Fq 'search-privacy-badge' components/JinjuApp.tsx
          grep -Fq '.search-privacy-badge' app/globals.css
          if grep -Fq 'FEED_EYEBROW' components/JinjuAppBridge.tsx; then exit 1; fi
          if grep -Fq '공개베타 · 개인정보 0%를 지향합니다.' components/JinjuApp.tsx; then exit 1; fi
      - name: Commit and self-delete workflow
        shell: bash
        run: |
          git config user.name 'jinju-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/search-privacy-badge.yml
          git add components/JinjuApp.tsx components/JinjuAppBridge.tsx app/globals.css
          git commit -m 'attach privacy badge to search bar'
          git push origin HEAD:agent/search-privacy-badge
