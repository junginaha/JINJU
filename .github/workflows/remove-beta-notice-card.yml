name: Remove beta notice card

on:
  push:
    branches:
      - agent/remove-beta-notice-card
    paths:
      - .github/workflows/remove-beta-notice-card.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove notice UI and dead code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('components/JinjuApp.tsx')
          bridge_path = Path('components/JinjuAppBridge.tsx')
          css_path = Path('app/globals.css')

          app = app_path.read_text(encoding='utf-8')
          app_block = '''              <section className="beta-notice" aria-label="공개베타 안내">
                <div>
                  <p className="beta-notice-identity">조개가 아픔을 감내하며 귀한 보석을 만들어내듯, 사용자의 상처받은 경험과 진짜 속마음을 소중하게 품어주는 다정하고 정제된 공간입니다.</p>
                  <p className="beta-notice-detail">정식 공개 전 실제 사용 환경을 점검하고 있습니다. 글쓰기·검색·문제제보 흐름을 우선 안정화하고 있습니다.</p>
                </div>
                <nav aria-label="공개베타 바로가기"><a href="/beta">베타안내</a><a href="mailto:hello@xn--o55b9n.kr">문제제보</a></nav>
              </section>

'''
          if app.count(app_block) != 1:
              raise SystemExit(f'expected one beta notice JSX block, found {app.count(app_block)}')
          app_path.write_text(app.replace(app_block, ''), encoding='utf-8')

          bridge = bridge_path.read_text(encoding='utf-8')
          detail_const = 'const NOTICE_DETAIL = "실제 사용 환경을 계속 점검하며 글쓰기·검색·문제제보 흐름을 안정적으로 운영하고 있습니다.";\n'
          bridge_block = '''      const notice = document.querySelector<HTMLElement>(".beta-notice");
      if (notice) {
        notice.setAttribute("aria-label", "진주 안내");
        const detail = notice.querySelector<HTMLElement>(".beta-notice-detail");
        if (detail && detail.textContent !== NOTICE_DETAIL) detail.textContent = NOTICE_DETAIL;
        const guideLink = notice.querySelector<HTMLAnchorElement>('nav a[href="/beta"]');
        if (guideLink && guideLink.textContent !== "운영안내") guideLink.textContent = "운영안내";
      }

'''
          if bridge.count(detail_const) != 1:
              raise SystemExit(f'expected one NOTICE_DETAIL constant, found {bridge.count(detail_const)}')
          if bridge.count(bridge_block) != 1:
              raise SystemExit(f'expected one beta notice bridge block, found {bridge.count(bridge_block)}')
          bridge = bridge.replace(detail_const, '').replace(bridge_block, '')
          bridge_path.write_text(bridge, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          desktop_css = '''.beta-notice { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 14px; margin: -12px 0 18px; padding: 14px 15px; overflow: hidden; background: linear-gradient(135deg,#ffffff0e,#ffffff06); border: 1px solid #303030; border-radius: 16px; }
.beta-notice strong { display: block; color: #f1f1f1; font-size: 13px; }
.beta-notice p { margin: 5px 0 0; color: #aaa; font-size: 12px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
.beta-notice .beta-notice-identity { max-width: 540px; color: #dedbd8; font-size: 12px; font-weight: 650; line-height: 1.7; letter-spacing: 0; }
.beta-notice .beta-notice-detail { margin-top: 6px; color: #999; font-size: 11px; }
.beta-notice nav { display: flex; flex: none; flex-wrap: wrap; gap: 6px; }
.beta-notice a { display: inline-flex; min-height: 32px; align-items: center; padding: 0 11px; color: #dedede; font-size: 11px; font-weight: 700; border: 1px solid #3c3c3c; border-radius: 999px; }
.beta-notice a:hover { color: #fff; background: #242424; border-color: #666; }
'''
          mobile_css = '''  .beta-notice { grid-template-columns: minmax(0,1fr); align-items: start; padding: 13px; }
  .beta-notice nav { width: 100%; }
  .beta-notice a { flex: 1 1 0; justify-content: center; min-width: 0; white-space: nowrap; }
'''
          small_css = '  .beta-notice nav { display: grid; grid-template-columns: 1fr; }\n'
          for label, target in [('desktop', desktop_css), ('mobile', mobile_css), ('small', small_css)]:
              count = css.count(target)
              if count != 1:
                  raise SystemExit(f'expected one {label} beta notice CSS block, found {count}')
              css = css.replace(target, '')
          css_path.write_text(css, encoding='utf-8')
          PY

          if grep -RFn 'beta-notice' components/JinjuApp.tsx components/JinjuAppBridge.tsx app/globals.css; then
            echo 'Dead beta-notice references remain.' >&2
            exit 1
          fi
          if grep -F '조개가 아픔을 감내하며' components/JinjuApp.tsx; then
            echo 'Notice copy still remains.' >&2
            exit 1
          fi

      - name: Commit cleanup and self-delete workflow
        shell: bash
        run: |
          git config user.name 'jinju-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/remove-beta-notice-card.yml
          git add components/JinjuApp.tsx components/JinjuAppBridge.tsx app/globals.css
          git commit -m 'remove main beta notice card and dead styles'
          git push origin HEAD:agent/remove-beta-notice-card
