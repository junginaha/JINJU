name: Remove beta notice card

on:
  push:
    branches:
      - agent/remove-beta-notice-card
    paths:
      - .github/workflows/remove-beta-notice-card.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove notice UI and dead code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('components/JinjuApp.tsx')
          bridge_path = Path('components/JinjuAppBridge.tsx')
          css_path = Path('app/globals.css')

          app_lines = app_path.read_text(encoding='utf-8').splitlines(keepends=True)
          app_starts = [i for i, line in enumerate(app_lines) if '<section className="beta-notice"' in line]
          if len(app_starts) != 1:
              raise SystemExit(f'expected one beta notice JSX start, found {len(app_starts)}')
          app_start = app_starts[0]
          app_end = next((i for i in range(app_start + 1, len(app_lines)) if app_lines[i].strip() == '</section>'), None)
          if app_end is None:
              raise SystemExit('beta notice JSX end not found')
          if not any('조개가 아픔을 감내하며' in line for line in app_lines[app_start:app_end + 1]):
              raise SystemExit('unexpected beta notice JSX contents')
          del app_lines[app_start:app_end + 1]
          if app_start < len(app_lines) and not app_lines[app_start].strip():
              del app_lines[app_start]
          app_path.write_text(''.join(app_lines), encoding='utf-8')

          bridge_lines = bridge_path.read_text(encoding='utf-8').splitlines(keepends=True)
          detail_rows = [i for i, line in enumerate(bridge_lines) if line.startswith('const NOTICE_DETAIL = ')]
          if len(detail_rows) != 1:
              raise SystemExit(f'expected one NOTICE_DETAIL constant, found {len(detail_rows)}')
          del bridge_lines[detail_rows[0]]
          notice_starts = [i for i, line in enumerate(bridge_lines) if 'const notice = document.querySelector<HTMLElement>(".beta-notice")' in line]
          if len(notice_starts) != 1:
              raise SystemExit(f'expected one beta notice bridge start, found {len(notice_starts)}')
          bridge_start = notice_starts[0]
          bridge_end = next((i for i in range(bridge_start + 1, len(bridge_lines)) if bridge_lines[i] == '      }\n'), None)
          if bridge_end is None:
              raise SystemExit('beta notice bridge end not found')
          del bridge_lines[bridge_start:bridge_end + 1]
          if bridge_start < len(bridge_lines) and not bridge_lines[bridge_start].strip():
              del bridge_lines[bridge_start]
          bridge_path.write_text(''.join(bridge_lines), encoding='utf-8')

          css_lines = css_path.read_text(encoding='utf-8').splitlines(keepends=True)
          removed_css = [line for line in css_lines if '.beta-notice' in line]
          if len(removed_css) != 12:
              raise SystemExit(f'expected 12 beta notice CSS rules, found {len(removed_css)}')
          css_path.write_text(''.join(line for line in css_lines if '.beta-notice' not in line), encoding='utf-8')
          PY

          if grep -RFn 'beta-notice' components/JinjuApp.tsx components/JinjuAppBridge.tsx app/globals.css; then
            echo 'Dead beta-notice references remain.' >&2
            exit 1
          fi
          if grep -F '조개가 아픔을 감내하며' components/JinjuApp.tsx; then
            echo 'Notice copy still remains.' >&2
            exit 1
          fi

      - name: Commit cleanup and self-delete workflow
        shell: bash
        run: |
          git config user.name 'jinju-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/remove-beta-notice-card.yml
          git add components/JinjuApp.tsx components/JinjuAppBridge.tsx app/globals.css
          git commit -m 'remove main beta notice card and dead styles'
          git push origin HEAD:agent/remove-beta-notice-card
