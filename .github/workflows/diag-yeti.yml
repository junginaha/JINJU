name: diag-yeti
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "NS:"; dig +short NS xn--o55b9n.kr
          echo "APEX:"; dig +short A xn--o55b9n.kr
          echo "WWW:"; dig +short www.xn--o55b9n.kr; echo END
          whois xn--o55b9n.kr 2>/dev/null | grep -iE "등록대행자|Registrar|Name Server" | head -5 || true
