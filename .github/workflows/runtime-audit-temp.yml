name: Runtime dependency audit

on:
  push:
    branches:
      - agent/portfolio-hardening

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Registry versions
        shell: bash
        run: |
          for pkg in next react react-dom postcss brace-expansion fast-uri nanoid sharp; do
            echo "REGISTRY $pkg latest=$(npm view "$pkg" dist-tags.latest)"
          done
          echo "NEXT_TAGS $(npm view next dist-tags --json | tr -d '\n')"
          echo "BRACE_VERSIONS $(npm view brace-expansion versions --json | tr -d '\n' | tail -c 800)"
          echo "FAST_URI_VERSIONS $(npm view fast-uri versions --json | tr -d '\n' | tail -c 800)"
      - run: npm ci --omit=dev
      - name: Runtime audit details
        shell: bash
        run: |
          npm audit --omit=dev --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json','utf8'));
          console.log('RUNTIME_AUDIT_COUNTS', JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            console.log('RUNTIME_AUDIT_ITEM', JSON.stringify({name,severity:item.severity,isDirect:item.isDirect,range:item.range,via:item.via,effects:item.effects,fixAvailable:item.fixAvailable}));
          }
          NODE
