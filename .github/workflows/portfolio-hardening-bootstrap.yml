name: Portfolio hardening bootstrap

on:
  push:
    branches:
      - agent/portfolio-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply approved production hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path, before, after):
              content = read(path)
              count = content.count(before)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              write(path, content.replace(before, after, 1))

          # 1) Security-patched framework versions and explicit migration command.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["dependencies"]["next"] = "16.2.11"
          package["dependencies"]["react"] = "19.2.6"
          package["dependencies"]["react-dom"] = "19.2.6"
          package["scripts"]["migrate"] = "tsx scripts/migrate.ts"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          env = read(".env.example")
          if "CRON_SECRET=" not in env:
              env += "CRON_SECRET=use-a-long-random-cron-secret\n"
          write(".env.example", env)

          # 2) Maintenance endpoint: Vercel Cron bearer authentication before any mutation.
          write("app/api/maintenance/route.ts", r'''import { timingSafeEqual } from "../../../lib/admin-auth";
          import { db, databaseEnabled, ensureSchema } from "../../../lib/db";
          import { LEGACY_GENERIC_AUTO_COMMENT_BODIES } from "../../../lib/auto-comments";
          import { processDueAutoCommentJobs } from "../../../lib/auto-comment-jobs";
          import { PUBLIC_COMMENT_REWRITES } from "../../../lib/content-overrides";
          import { purgeExpiredReactions } from "../../../lib/reactions";
          import { notifySearchIndexes } from "../../../lib/search-indexing";

          export const dynamic = "force-dynamic";

          const responseHeaders = { "cache-control": "no-store" };

          function authorized(request: Request) {
            const expected = process.env.CRON_SECRET?.trim() || "";
            if (!expected) return false;
            const authorization = request.headers.get("authorization") || "";
            const supplied = authorization.startsWith("Bearer ") ? authorization.slice(7) : "";
            return Boolean(supplied) && timingSafeEqual(expected, supplied);
          }

          export async function GET(request: Request) {
            if (!process.env.CRON_SECRET?.trim()) {
              return Response.json({ ok: false, error: "maintenance_secret_not_configured" }, { status: 503, headers: responseHeaders });
            }
            if (!authorized(request)) {
              return Response.json({ ok: false, error: "unauthorized" }, { status: 401, headers: responseHeaders });
            }
            if (!databaseEnabled()) return Response.json({ ok: false }, { status: 503, headers: responseHeaders });

            await ensureSchema();
            let rewrittenComments = 0;
            for (const [id, rewrite] of PUBLIC_COMMENT_REWRITES) {
              const rows = await db()`
                UPDATE comments
                SET content = ${rewrite.to}
                WHERE id = ${id} AND content = ${rewrite.from}
                RETURNING id`;
              rewrittenComments += rows.length;
            }

            const removedLegacyComments: Array<Record<string, unknown>> = [];
            for (const body of LEGACY_GENERIC_AUTO_COMMENT_BODIES) {
              const rows = await db()`
                DELETE FROM comments
                WHERE id LIKE 'jinju-auto-%' AND content = ${body}
                RETURNING post_id`;
              removedLegacyComments.push(...rows);
            }

            const affectedPostIds = [...new Set(removedLegacyComments.map((row) => String(row.post_id)))];
            for (const postId of affectedPostIds) {
              await db()`
                UPDATE posts
                SET comment_count = (
                  SELECT COUNT(*)::INTEGER FROM comments
                  WHERE post_id = ${postId} AND status = 'approved' AND created_at <= NOW()
                ), updated_at = NOW()
                WHERE id = ${postId}`;
            }

            await Promise.all([
              db()`DELETE FROM admin_sessions WHERE expires_at <= NOW()`,
              db()`DELETE FROM rate_limits WHERE expires_at <= NOW()`,
              db()`DELETE FROM abuse_restrictions WHERE expires_at <= NOW()`,
              db()`DELETE FROM zk_members WHERE expires_at <= NOW()`,
              db()`DELETE FROM zk_group_roots WHERE expires_at <= NOW()`,
              db()`DELETE FROM zk_nullifiers WHERE expires_at <= NOW()`,
              db()`DELETE FROM feedback_reports WHERE expires_at <= NOW()`,
              purgeExpiredReactions(),
            ]);

            const autoCommentJobs = await processDueAutoCommentJobs();
            const indexableRows = await db()`
              SELECT id
              FROM posts
              WHERE status = 'approved'
                AND visibility = 'public'
                AND created_at <= NOW() - INTERVAL '12 hours'
                AND created_at > NOW() - INTERVAL '36 hours'
              ORDER BY created_at ASC
              LIMIT 100`;
            if (indexableRows.length) {
              await notifySearchIndexes(indexableRows.map((row) => `/post/${encodeURIComponent(String(row.id))}`));
            }

            return Response.json({
              ok: true,
              rewrittenComments,
              removedLegacyComments: removedLegacyComments.length,
              processedAutoCommentJobs: autoCommentJobs.length,
              indexedPosts: indexableRows.length,
            }, { headers: responseHeaders });
          }
          '''.replace("          ", ""))

          # Health exposes whether the protected scheduled-maintenance secret exists, without making site health depend on it.
          replace_once(
              "app/api/health/route.ts",
              '  const protectionReady = abuseProtection.hmac && abuseProtection.turnstile;\n',
              '  const protectionReady = abuseProtection.hmac && abuseProtection.turnstile;\n  const maintenanceCron = Boolean(process.env.CRON_SECRET?.trim());\n',
          )
          health = read("app/api/health/route.ts")
          health = health.replace('      abuseProtection,\n      checkedAt,', '      abuseProtection,\n      maintenanceCron,\n      checkedAt,')
          health = health.replace('      abuseProtection,\n      publicPostCount:', '      abuseProtection,\n      maintenanceCron,\n      publicPostCount:')
          write("app/api/health/route.ts", health)

          # 3) Real 30-item API pagination. Keep the existing seed+DB merge semantics intact.
          posts_route = read("app/api/posts/route.ts")
          start = posts_route.index("export async function GET(request: Request) {")
          end = posts_route.index("export async function POST(request: Request) {")
          new_get = r'''export async function GET(request: Request) {
            const url = new URL(request.url);
            const requestedCategory = url.searchParams.get("category")?.trim() || "전체";
            const category = requestedCategory === "전체" ? "전체" : normalizePublicCategory(requestedCategory);
            const query = url.searchParams.get("q")?.trim().toLocaleLowerCase("ko-KR") || "";
            const sort = url.searchParams.get("sort") === "popular" ? "popular" : "latest";
            const parsedLimit = Number.parseInt(url.searchParams.get("limit") || "30", 10);
            const parsedOffset = Number.parseInt(url.searchParams.get("offset") || "0", 10);
            const limit = Math.min(30, Math.max(1, Number.isFinite(parsedLimit) ? parsedLimit : 30));
            const offset = Math.max(0, Number.isFinite(parsedOffset) ? parsedOffset : 0);

            const selectPage = (source: Awaited<ReturnType<typeof getPublicPosts>>) => {
              const siteTotal = source.length;
              let posts = source;
              if (category !== "전체") posts = posts.filter((post) => post.category === category);
              if (query) posts = posts.filter((post) => `${post.title} ${post.content} ${post.category}`.toLocaleLowerCase("ko-KR").includes(query));
              posts = [...posts].sort((a, b) => sort === "popular"
                ? (b.heard + b.same + b.commentCount * 3) - (a.heard + a.same + a.commentCount * 3)
                : Date.parse(b.createdAt) - Date.parse(a.createdAt));
              const total = posts.length;
              const page = posts.slice(offset, offset + limit);
              const nextOffset = offset + page.length;
              return { posts: page, total, siteTotal, hasMore: nextOffset < total, nextOffset };
            };

            try {
              await verifyPublicDatabase();
            } catch (error) {
              Sentry.captureException(error, { tags: { area: "public-feed", service: "database" } });
              console.error("[posts] public database unavailable", error);
              const fallbackPosts = await getPublicPosts().catch(() => []);
              return Response.json({
                warning: "최신 의견 연결이 잠시 늦어지고 있습니다.",
                ...selectPage(fallbackPosts),
                database: false,
                fallback: true,
                degraded: true,
              }, { status: 200, headers: { "cache-control": "no-store" } });
            }

            const page = selectPage(await getPublicPosts());
            return Response.json({ ...page, database: true, fallback: false }, { headers: { "cache-control": "no-store" } });
          }

          '''.replace("          ", "")
          posts_route = posts_route[:start] + new_get + posts_route[end:]
          posts_route = posts_route.replace('notifySearchIndexes(["/", `/post/${encodeURIComponent(id)}`]),', 'notifySearchIndexes(["/"]),')
          write("app/api/posts/route.ts", posts_route)

          # 4) Preserve the user's current minimal load-more visual, but move paging into React/API instead of DOM hiding.
          write("components/JinjuAppBridge.tsx", r'''"use client";

          import { useEffect, useRef } from "react";
          import { SITE_DEFINITION } from "@/lib/search-indexing";
          import JinjuApp, { type Post } from "./JinjuApp";

          type JinjuAppBridgeProps = {
            initialPosts?: Post[];
            initialPostId?: string | null;
            initialTotal?: number;
          };

          const FEED_ACCESSIBLE_NAME = "진주 익명 의견 게시판";
          const COMPOSER_TITLE = "익명 의견 남기기";
          const COMPOSER_SUBTITLE = "안전하게 속마음을 들려주세요.";
          const BODY_PLACEHOLDER = "무슨 일이 있었는지 천천히 들려주세요.\n편한 마음으로 적으셔도 괜찮아요.";
          const WRITE_BUTTON_LABELS = ["새 의견 쓰기", "나의 의견", "의견 쓰기", "의견 남기기"];

          const feedPagerCss = `
          .feed-pager-slot {
            display: flex;
            width: 100%;
            justify-content: center;
            margin: 20px 0 34px;
            padding: 0;
          }
          .feed-more-button {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 4px;
            color: #b7b7b7;
            text-align: center;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: 0;
            box-shadow: none;
            transition: color .2s ease, opacity .2s ease, transform .2s ease;
          }
          .feed-more-button:hover { color: #f2f2f2; transform: translateY(-1px); }
          .feed-more-button:active { opacity: .72; transform: translateY(1px); }
          .feed-more-button:disabled { cursor: default; opacity: .62; transform: none; }
          .feed-more-button:focus-visible { outline: 1px solid #777; outline-offset: 7px; border-radius: 6px; }
          .feed-more-label {
            color: transparent;
            font-size: 14px;
            font-weight: 720;
            line-height: 1;
            letter-spacing: -.025em;
            white-space: nowrap;
            background: linear-gradient(105deg, #8f8f8f 15%, #f3f3f3 48%, #aaa 72%, #8f8f8f 100%) 0 0 / 220% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: feed-more-shimmer 3.8s ease-in-out infinite;
          }
          .feed-more-arrow {
            display: inline-block;
            color: #c8c8c8;
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            transform: translateY(-1px);
            animation: feed-more-bob 1.8s ease-in-out infinite;
          }
          .feed-more-button:hover .feed-more-arrow { color: #f1f1f1; }
          @keyframes feed-more-shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
          }
          @keyframes feed-more-bob {
            0%, 100% { opacity: .62; transform: translateY(-2px); }
            50% { opacity: 1; transform: translateY(3px); }
          }
          @media (max-width: 640px) {
            .feed-pager-slot { margin: 16px 0 28px; }
            .feed-more-button { min-height: 42px; gap: 7px; }
            .feed-more-label { font-size: 13.5px; }
            .feed-more-arrow { font-size: 17px; }
          }
          @media (prefers-reduced-motion: reduce) {
            .feed-more-label {
              color: #d8d8d8;
              background: none;
              -webkit-text-fill-color: currentColor;
              animation: none;
            }
            .feed-more-arrow { animation: none; opacity: 1; transform: none; }
            .feed-more-button { transition: none; }
          }
          `;

          /** Thin presentation compatibility boundary around the legacy JinjuApp monolith. */
          export default function JinjuAppBridge({ initialPosts, initialPostId = null, initialTotal }: JinjuAppBridgeProps) {
            useEffect(() => {
              let active = true;
              const frames = new Set<number>();

              function ensureTermsLink(footer: HTMLElement) {
                if (footer.querySelector('a[href="/terms"]')) return;
                const termsLink = document.createElement("a");
                termsLink.href = "/terms";
                termsLink.textContent = "이용약관";
                const contact = footer.querySelector('a[href^="mailto:"]');
                const footerCopy = footer.querySelector("p");
                footer.insertBefore(termsLink, contact || footerCopy || null);
              }

              function applyFeedPresentation() {
                const heading = document.querySelector<HTMLElement>(".feed-heading");
                if (!heading) return false;
                document.querySelector<HTMLElement>(".chat-main#feed")?.setAttribute("aria-label", FEED_ACCESSIBLE_NAME);
                const title = heading.querySelector<HTMLElement>("h1");
                if (title) {
                  title.textContent = FEED_ACCESSIBLE_NAME;
                  title.hidden = true;
                  title.removeAttribute("style");
                }
                const footer = document.querySelector<HTMLElement>(".sidebar-footer");
                if (footer) {
                  const footerCopy = footer.querySelector<HTMLElement>("p");
                  if (footerCopy && footerCopy.textContent !== SITE_DEFINITION) footerCopy.textContent = SITE_DEFINITION;
                  ensureTermsLink(footer);
                }
                return true;
              }

              function applyComposerPresentation() {
                const intro = document.querySelector<HTMLElement>(".composer-intro");
                if (!intro) return false;
                const eyebrow = intro.querySelector<HTMLElement>(".eyebrow");
                if (eyebrow) eyebrow.hidden = true;
                const title = intro.querySelector<HTMLElement>("#write-title");
                if (title && title.textContent !== COMPOSER_TITLE) title.textContent = COMPOSER_TITLE;
                const paragraphs = intro.querySelectorAll<HTMLElement>("p");
                const subtitle = paragraphs[paragraphs.length - 1];
                if (subtitle && subtitle.textContent !== COMPOSER_SUBTITLE) subtitle.textContent = COMPOSER_SUBTITLE;
                const textarea = document.querySelector<HTMLTextAreaElement>('textarea[aria-label="의견 본문"]');
                if (textarea && textarea.placeholder !== BODY_PLACEHOLDER) textarea.placeholder = BODY_PLACEHOLDER;
                return true;
              }

              function schedule(action: () => boolean | void, retryOnce = false) {
                const first = requestAnimationFrame(() => {
                  frames.delete(first);
                  if (!active) return;
                  const applied = action();
                  if (!retryOnce || applied !== false) return;
                  const second = requestAnimationFrame(() => {
                    frames.delete(second);
                    if (active) action();
                  });
                  frames.add(second);
                });
                frames.add(first);
              }

              function handleClick(event: MouseEvent) {
                const target = event.target instanceof Element ? event.target : null;
                if (!target) return;
                if (target.closest(".detail-home")) schedule(applyFeedPresentation, true);
                const button = target.closest("button");
                if (!button) return;
                const label = button.textContent?.replace(/\s+/g, " ").trim() || "";
                if (WRITE_BUTTON_LABELS.some((item) => label.includes(item))) schedule(applyComposerPresentation, true);
              }

              applyFeedPresentation();
              applyComposerPresentation();
              document.addEventListener("click", handleClick, true);
              window.addEventListener("popstate", () => schedule(applyFeedPresentation, true));

              return () => {
                active = false;
                document.removeEventListener("click", handleClick, true);
                frames.forEach((frame) => cancelAnimationFrame(frame));
                frames.clear();
              };
            }, [initialPostId, initialPosts?.length]);

            return (
              <>
                <style>{feedPagerCss}</style>
                <JinjuApp initialPosts={initialPosts ?? []} initialPostId={initialPostId} initialTotal={initialTotal} />
              </>
            );
          }
          '''.replace("          ", ""))

          jinju = read("components/JinjuApp.tsx")
          before = r'''const topics = ["전체", "일상", "관계", "직장", "돈", "사회", "제안", "질문"];
          const POST_DRAFT_KEY="jinju-post-draft-v1",COMMENT_DELETE_KEYS="jinju-owned-comments-v1";
          const MAX_RECORDING_MS=120_000,TRANSCRIPTION_TIMEOUT_MS=25_000;

          function readKeys'''.replace("          ", "")
          after = r'''const topics = ["전체", "일상", "관계", "직장", "돈", "사회", "제안", "질문"];
          const POST_DRAFT_KEY="jinju-post-draft-v1",COMMENT_DELETE_KEYS="jinju-owned-comments-v1";
          const MAX_RECORDING_MS=120_000,TRANSCRIPTION_TIMEOUT_MS=25_000,FEED_PAGE_SIZE=30;
          type FeedApiPost=Omit<Post,"date"|"comments">&{createdAt:string;commentCount?:number};
          type FeedApiResponse={posts?:FeedApiPost[];total?:number;siteTotal?:number;hasMore?:boolean;nextOffset?:number;error?:string};
          type FeedQueryOverride={topic?:string;query?:string;sort?:"latest"|"popular"};
          function normalizeFeedPosts(rows:FeedApiPost[]):Post[]{return rows.map(({createdAt,commentCount,...post})=>({...post,date:new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"numeric",day:"numeric"}).format(new Date(createdAt)),comments:Array.from({length:commentCount??0},(_,index)=>({id:`count-${index}`,body:"",createdAt:""}))}))}

          function readKeys'''.replace("          ", "")
          if jinju.count(before) != 1: raise RuntimeError("JinjuApp constants anchor changed")
          jinju = jinju.replace(before, after, 1)

          before = 'export default function JinjuApp({ initialPosts = seedPosts, initialPostId = null }: { initialPosts?: Post[]; initialPostId?: string | null }) {'
          after = 'export default function JinjuApp({ initialPosts = seedPosts, initialPostId = null, initialTotal }: { initialPosts?: Post[]; initialPostId?: string | null; initialTotal?: number }) {'
          if jinju.count(before) != 1: raise RuntimeError("JinjuApp props anchor changed")
          jinju = jinju.replace(before, after, 1)

          before = r'''  const [posts, setPosts] = useState(initialPosts);
            const [feedState, setFeedState] = useState<"loading" | "ready" | "error">("loading");'''.replace("            ", "  ")
          after = r'''  const [posts, setPosts] = useState(initialPosts);
            const [feedState, setFeedState] = useState<"loading" | "ready" | "error">("loading");
            const [feedTotal,setFeedTotal]=useState(Math.max(initialTotal??initialPosts.length,initialPosts.length));
            const [feedNextOffset,setFeedNextOffset]=useState(initialPosts.length);
            const [hasMorePosts,setHasMorePosts]=useState((initialTotal??initialPosts.length)>initialPosts.length);
            const [feedLoadingMore,setFeedLoadingMore]=useState(false);
            const [feedMoreError,setFeedMoreError]=useState(false);'''.replace("            ", "  ")
          if jinju.count(before) != 1: raise RuntimeError("JinjuApp feed state anchor changed")
          jinju = jinju.replace(before, after, 1)

          before = r'''  const bodyInputRef=useRef<HTMLTextAreaElement|null>(null);

            const loadPosts = useCallback(async () => {
              try {
                const response = await fetch("/api/posts", { cache: "no-store" });
                if (!response.ok) throw new Error("feed");
                const data = await response.json() as { posts?: Array<Omit<Post, "date" | "comments"> & { createdAt: string; commentCount?: number }> };
                setPosts((data.posts || []).map((post) => ({
                  ...post,
                  date: new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "numeric", day: "numeric" }).format(new Date(post.createdAt)),
                  comments: Array.from({ length: post.commentCount ?? 0 }, (_, index) => ({ id: `count-${index}`, body: "", createdAt: "" })),
                })));
                setFeedState("ready");
              } catch {
                setFeedState("error");
              }
            }, []);'''.replace("            ", "  ")
          after = r'''  const bodyInputRef=useRef<HTMLTextAreaElement|null>(null);
            const feedRequestRef=useRef(0);

            const loadPosts = useCallback(async (offset=0,append=false,override?:FeedQueryOverride) => {
              const requestId=++feedRequestRef.current;
              if(append){setFeedLoadingMore(true);setFeedMoreError(false)}else setFeedState("loading");
              try {
                const activeTopic=override?.topic??topic,activeQuery=override?.query??query,activeSort=override?.sort??sort;
                const params=new URLSearchParams({limit:String(FEED_PAGE_SIZE),offset:String(Math.max(0,offset)),sort:activeSort});
                if(activeTopic!=="전체")params.set("category",activeTopic);
                if(activeQuery.trim())params.set("q",activeQuery.trim());
                const response=await fetch(`/api/posts?${params.toString()}`,{cache:"no-store"});
                const data=await response.json() as FeedApiResponse;
                if(!response.ok)throw new Error(data.error||"feed");
                if(requestId!==feedRequestRef.current)return;
                const incoming=normalizeFeedPosts(data.posts||[]);
                setPosts((current)=>{
                  if(!append)return incoming;
                  const merged=new Map(current.map((post)=>[post.id,post]));
                  incoming.forEach((post)=>merged.set(post.id,post));
                  return [...merged.values()];
                });
                const nextOffset=Number.isFinite(data.nextOffset)?Math.max(0,Number(data.nextOffset)):offset+incoming.length;
                const resultTotal=Number.isFinite(data.total)?Math.max(0,Number(data.total)):nextOffset;
                setFeedNextOffset(nextOffset);
                setHasMorePosts(typeof data.hasMore==="boolean"?data.hasMore:nextOffset<resultTotal);
                if(Number.isFinite(data.siteTotal))setFeedTotal(Math.max(0,Number(data.siteTotal)));
                else if(!append&&!activeQuery.trim()&&activeTopic==="전체")setFeedTotal(resultTotal);
                setFeedMoreError(false);
                setFeedState("ready");
              } catch {
                if(requestId!==feedRequestRef.current)return;
                if(append)setFeedMoreError(true);else setFeedState("error");
              } finally {
                if(requestId===feedRequestRef.current)setFeedLoadingMore(false);
              }
            }, [query,sort,topic]);'''.replace("            ", "  ")
          if jinju.count(before) != 1: raise RuntimeError("JinjuApp loadPosts anchor changed")
          jinju = jinju.replace(before, after, 1)

          before = '  useEffect(() => { void loadPosts(); }, [loadPosts]);'
          after = r'''  useEffect(()=>{
            if(selectedPostId)return;
            const timer=window.setTimeout(()=>void loadPosts(0,false),query.trim()?220:0);
            return()=>window.clearTimeout(timer);
          },[loadPosts,query,selectedPostId]);'''
          if jinju.count(before) != 1: raise RuntimeError("JinjuApp feed effect anchor changed")
          jinju = jinju.replace(before, after, 1)

          before = r'''  const filteredPosts = useMemo(() => {
            const normalized = query.trim().toLowerCase();
            return posts
              .filter((post) => topic === "전체" || post.category === topic)
              .filter((post) => !normalized || `${post.title} ${post.content}`.toLowerCase().includes(normalized))
              .sort((a, b) => sort === "popular" ? (b.heard + b.same) - (a.heard + a.same) : 0);
          }, [posts, query, sort, topic]);'''
          after = before + r'''

          const loadMorePosts=useCallback(()=>{
            if(feedLoadingMore||!hasMorePosts)return;
            void loadPosts(feedNextOffset,true);
          },[feedLoadingMore,feedNextOffset,hasMorePosts,loadPosts]);'''
          if jinju.count(before) != 1: raise RuntimeError("JinjuApp filteredPosts anchor changed")
          jinju = jinju.replace(before, after, 1)

          before = '    await loadPosts();\n    setPublishedPostId(data.id || null);'
          after = '    await loadPosts(0,false,{topic:"전체",query:"",sort:"latest"});\n    setPublishedPostId(data.id || null);'
          if jinju.count(before) != 1: raise RuntimeError("JinjuApp publish reload anchor changed")
          jinju = jinju.replace(before, after, 1)

