name: Portfolio hardening bootstrap

on:
  push:
    branches:
      - agent/portfolio-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply approved production hardening
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import textwrap

          source = subprocess.check_output([
              "git", "show",
              "b39151ea60c3b79422e5253fd7cc3b78a433036b:.github/workflows/portfolio-hardening-bootstrap.yml",
          ], text=True)
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n\n      - name: Refresh dependency lockfile"
          if start not in source or end not in source:
              raise RuntimeError("Unable to recover the approved hardening script")
          code = textwrap.dedent(source.split(start, 1)[1].split(end, 1)[0])

          patch_start = code.index("before = r'''  const filteredPosts")
          patch_end_marker = "jinju = jinju.replace(before, after, 1)"
          patch_end = code.index(patch_end_marker, patch_start) + len(patch_end_marker)
          resilient = (
              'filter_start = jinju.index("  const filteredPosts = useMemo(() => {")\n'
              'filter_end_marker = "  }, [posts, query, sort, topic]);"\n'
              'filter_end = jinju.index(filter_end_marker, filter_start) + len(filter_end_marker)\n'
              'load_more_hook = "\\n\\n  const loadMorePosts=useCallback(()=>{\\n    if(feedLoadingMore||!hasMorePosts)return;\\n    void loadPosts(feedNextOffset,true);\\n  },[feedLoadingMore,feedNextOffset,hasMorePosts,loadPosts]);"\n'
              'jinju = jinju[:filter_end] + load_more_hook + jinju[filter_end:]'
          )
          code = code[:patch_start] + resilient + code[patch_end:]

          patch2_start = code.index("continued = r'''")
          patch2_end_marker = "jinju = jinju.replace(empty_before, empty_after, 1)"
          patch2_end = code.index(patch2_end_marker, patch2_start) + len(patch2_end_marker)
          resilient2 = (
              'continued_start = jinju.index(\'              <section className="post-feed continued-feed"\')\n'
              'continued_close_marker = "              </section>"\n'
              'continued_close = jinju.index(continued_close_marker, continued_start) + len(continued_close_marker)\n'
              'pager_markup = "\\n\\n              {hasMorePosts && <div className=\\\"feed-pager-slot\\\">\\n                <button className=\\\"feed-more-button\\\" type=\\\"button\\\" onClick={loadMorePosts} disabled={feedLoadingMore} aria-busy={feedLoadingMore}>\\n                  <span className=\\\"feed-more-label\\\">{feedLoadingMore?\\\"불러오는 중…\\\":feedMoreError?\\\"다시 불러오기\\\":\\\"더 보기\\\"}</span>\\n                  <span className=\\\"feed-more-arrow\\\" aria-hidden=\\\"true\\\">↓</span>\\n                </button>\\n              </div>}"\n'
              'jinju = jinju[:continued_close] + pager_markup + jinju[continued_close:]\n'
              'empty_one = \'              {feedState === "ready" && posts.length === 0 && <section className="feed-empty"><h2>아직 공개된 의견이 없어요.</h2><p>첫 의견을 남겨주세요.</p><button type="button" onClick={openComposer}>의견 남기기</button></section>}\'\n'
              'empty_one_new = \'              {feedState === "ready" && feedTotal === 0 && <section className="feed-empty"><h2>아직 공개된 의견이 없어요.</h2><p>첫 의견을 남겨주세요.</p><button type="button" onClick={openComposer}>의견 남기기</button></section>}\'\n'
              'empty_two = \'              {posts.length > 0 && !filteredPosts.length && <section className="feed-empty"><h2>찾는 의견이 없습니다</h2><p>다른 검색어나 게시판을 선택해 보세요.</p></section>}\'\n'
              'empty_two_new = \'              {feedState === "ready" && feedTotal > 0 && !filteredPosts.length && <section className="feed-empty"><h2>찾는 의견이 없습니다</h2><p>다른 검색어나 게시판을 선택해 보세요.</p></section>}\'\n'
              'if jinju.count(empty_one) != 1 or jinju.count(empty_two) != 1: raise RuntimeError("JinjuApp empty state anchors changed")\n'
              'jinju = jinju.replace(empty_one, empty_one_new, 1).replace(empty_two, empty_two_new, 1)'
          )
          code = code[:patch2_start] + resilient2 + code[patch2_end:]
          exec(compile(code, "portfolio-hardening.py", "exec"))
          PY

      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/portfolio-hardening-bootstrap.yml
          rm .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden portfolio production runtime"
          git push origin HEAD:agent/portfolio-hardening
