name: Portfolio hardening bootstrap

on:
  push:
    branches:
      - agent/portfolio-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply approved production hardening
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import textwrap

          source = subprocess.check_output([
              "git", "show",
              "b39151ea60c3b79422e5253fd7cc3b78a433036b:.github/workflows/portfolio-hardening-bootstrap.yml",
          ], text=True)
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n\n      - name: Refresh dependency lockfile"
          if start not in source or end not in source:
              raise RuntimeError("Unable to recover the approved hardening script")
          code = source.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(code), "portfolio-hardening.py", "exec"))
          PY

      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/portfolio-hardening-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden portfolio production runtime"
          git push origin HEAD:agent/portfolio-hardening
