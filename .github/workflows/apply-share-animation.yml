name: Apply subtle share button animation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-share-animation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add minimal share motion
        shell: bash
        run: |
          if ! grep -q "JINJU_SHARE_MOTION" app/globals.css; then
            cat >> app/globals.css <<'CSS'

/* JINJU_SHARE_MOTION: existing share buttons only */
.share-post-button,
.detail-stats > button:nth-of-type(3) {
  animation: jinju-share-breathe 2.2s ease-in-out 1.1s 2;
  transform-origin: center;
}

@keyframes jinju-share-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.018); }
}

@media (prefers-reduced-motion: reduce) {
  .share-post-button,
  .detail-stats > button:nth-of-type(3) {
    animation: none;
  }
}
CSS
          fi
          rm -f .github/workflows/apply-share-animation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css .github/workflows/apply-share-animation.yml
          git commit -m "Add subtle share button motion"
          git push origin main